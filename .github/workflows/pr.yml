name: PR Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # What a release would publish: the files, and that it packs.
      - run: npm pack --dry-run
